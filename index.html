<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Christmas Countdown</title>
		<link rel="stylesheet" href="stylesheet.css" />
		<script
			src="https://kit.fontawesome.com/92e72ec4eb.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<div id="coutdown-container">
			<h2>There are only</h2>
			<div class="row-container">
				<div class="counter">
					<h1 id="days">00</h1>
					<h2>days</h2>
				</div>

				<div class="counter">
					<h1 id="hours">00</h1>
					<h2>hours</h2>
				</div>

				<div class="counter">
					<h1 id="minutes">00</h1>
					<h2>minutes</h2>
				</div>

				<div class="counter">
					<h1 id="seconds">00</h1>
					<h2>seconds</h2>
				</div>
			</div>
			<h2>until Christmas !</h2>
		</div>

		<button id="song-button"><i class="fa-solid fa-volume-xmark"></i></button>
	</body>
	<script src="script.js"></script>
</html>
